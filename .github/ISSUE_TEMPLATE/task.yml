name: Task
description: "Use this template to add a Task to the project."
title: "task: "
labels: []
projects: ["swissredcross/13"]
assignees: []
body:
  - type: input
    id: ticketnumber
    attributes:
      label: "📧 Context"
      description: "Ticket Number from Zendesk"
      value: "[resolves/fixes 🎟️ #TICKETNUMBER](https://srkcrs.zendesk.com/agent/tickets/TICKETNUMBER)"
    validations:
      required: false
  - type: textarea
    id: user-story
    attributes:
      label: "✍️ User Story"
      description: "As a [user role], I want to [user action] so that [user benefit]."
      value: |
        **As a** role
        **I want to** action
        **So that** benefit
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: "Requirements"
      description: "Provide clear and actionable requirements for the task."
      value: |
        - [ ] Requirement 1
        - [ ] Requirement 2
    validations:
      required: true
  - type: textarea
    id: visualization
    attributes:
      label: "Visual References"
      description: "Add screenshots or mockups that illustrate the requested change. Include before and after examples if helpful."
      placeholder: "Add an image or link to a specific design frame."
    validations:
      required: false
  - type: textarea
    id: naming
    attributes:
      label: "Suggested Names"
      description: "Suggest names for new components, fields, or content types. Include editorial labels and technical identifiers where relevant."
      placeholder: "Name: description/reasoning"
    validations:
      required: false
  - type: textarea
    id: links
    attributes:
      label: "Supporting Links"
      description: "Provide links to design, documentation, or other relevant resources."
      value: |
        - [Design Figma](figma_url)
        - [Documentation / Spec](doc_url)
    validations:
      required: false
